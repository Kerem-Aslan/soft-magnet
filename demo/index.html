<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>soft-magnet</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f4fb;
        --ink: #1d1a26;
        --muted: #6c6680;
        --accent: #6a4fd6;
        --line: #d9d3ea;
        --card: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15131c;
          --ink: #ece9f5;
          --muted: #9a94ad;
          --accent: #9d86ff;
          --line: #2f2a3d;
          --card: #1e1b28;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 64px 16px 96px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 40px;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
      section {
        margin-top: 56px;
      }
      h2 {
        margin: 0 0 24px;
        font-size: 18px;
      }
      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
      }
      button {
        padding: 12px 22px;
        border: 1px solid var(--accent);
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        will-change: translate, scale;
      }
      button.outline {
        background: transparent;
        color: var(--accent);
      }
      .dots {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
        gap: 28px;
        padding: 32px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--card);
      }
      .dot {
        aspect-ratio: 1;
        border-radius: 50%;
        background: hsl(var(--h) 60% 62%);
        will-change: translate, scale;
      }
      .controls {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px 24px;
        margin-bottom: 24px;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 14px;
        color: var(--muted);
      }
      output {
        color: var(--ink);
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] {
        width: 100%;
        accent-color: var(--accent);
      }
      pre {
        margin: 0;
        padding: 16px;
        overflow-x: auto;
        border-radius: 12px;
        background: var(--card);
        border: 1px solid var(--line);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>soft-magnet</h1>
      <p>
        Elements lean toward the cursor and grow a little, with spring motion. Made for
        <a href="https://flowgraphs.app">flowgraphs.app</a>.
        <a href="https://github.com/Kerem-Aslan/soft-magnet">GitHub</a>
      </p>

      <section>
        <h2>Buttons</h2>
        <div class="buttons">
          <button data-magnet>Full strength</button>
          <button data-magnet="0.5" class="outline">Half strength</button>
        </div>
      </section>

      <section>
        <h2>Try the options</h2>
        <div class="controls">
          <label>range <output id="range-out"></output><input id="range" type="range" min="20" max="300" value="120" /></label>
          <label>pull <output id="pull-out"></output><input id="pull" type="range" min="0" max="30" value="7" /></label>
          <label>grow <output id="grow-out"></output><input id="grow" type="range" min="0" max="0.5" step="0.01" value="0.1" /></label>
          <label>strength <output id="strength-out"></output><input id="strength" type="range" min="0" max="2" step="0.05" value="1" /></label>
        </div>
        <div class="dots" id="dots"></div>
      </section>

      <section>
        <h2>Code</h2>
        <pre><code id="code"></code></pre>
      </section>
    </main>

    <script type="module">
      import { magnet } from "../dist/index.js";

      for (const el of document.querySelectorAll("[data-magnet]")) {
        magnet(el, { strength: Number(el.dataset.magnet || 1) });
      }

      const grid = document.getElementById("dots");
      const dots = [];
      for (let i = 0; i < 24; i++) {
        const dot = document.createElement("div");
        dot.className = "dot";
        dot.style.setProperty("--h", String((250 + i * 15) % 360));
        grid.append(dot);
        dots.push(magnet(dot));
      }

      const names = ["range", "pull", "grow", "strength"];
      const code = document.getElementById("code");
      const update = () => {
        const options = Object.fromEntries(names.map((n) => [n, Number(document.getElementById(n).value)]));
        for (const n of names) document.getElementById(`${n}-out`).textContent = options[n];
        for (const m of dots) m.update(options);
        const args = Object.entries(options).map(([k, v]) => `${k}: ${v}`).join(", ");
        code.textContent = `import { magnet } from "soft-magnet";\n\nmagnet(element, { ${args} });`;
      };
      for (const n of names) document.getElementById(n).addEventListener("input", update);
      update();
    </script>
  </body>
</html>
